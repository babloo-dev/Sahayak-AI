spring.application.name=sahayak-ai-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sahayak_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:replace_with_local_db_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:replace_with_local_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
sahayak.cors.allowed-origin=${SAHAYAK_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
sahayak.auth.dev-token.enabled=${SAHAYAK_AUTH_DEV_TOKEN_ENABLED:false}
